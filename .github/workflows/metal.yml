name: Apple Silicon Metal

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: metal-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  MACOSX_DEPLOYMENT_TARGET: "14.0"

jobs:
  build:
    name: Compile and static checks
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false

      - name: Confirm Apple Silicon toolchain
        run: |
          test "$(uname -s)" = Darwin
          test "$(uname -m)" = arm64
          go version
          xcrun --show-sdk-version

      - name: Verify license notices
        run: make check-licenses

      - name: Verify the binary-first macOS installer
        run: |
          bash -n install-macos.sh
          bash install-macos.sh --help >/dev/null
          fixture=$(mktemp -d "${RUNNER_TEMP}/mumax3-installer.XXXXXX")
          trap 'rm -rf "$fixture"' EXIT
          mkdir -p "$fixture/release" "$fixture/home" "$fixture/bin"
          printf '%s\n' '#!/bin/bash' \
            'if [[ "$1" == "-ultrafast-probe" ]]; then' \
            '  echo "mumax3-ultrafast desktop-api=1 backend=metal"' \
            'fi' > "$fixture/release/mumax3"
          chmod +x "$fixture/release/mumax3"
          tar -C "$fixture/release" -czf "$fixture/release/mumax3-ultrafast-darwin-arm64.tar.gz" mumax3
          (
            cd "$fixture/release"
            shasum -a 256 mumax3-ultrafast-darwin-arm64.tar.gz \
              > mumax3-ultrafast-darwin-arm64.tar.gz.sha256
          )
          HOME="$fixture/home" \
            MUMAX3_RELEASE_BASE_URL="file://$fixture/release" \
            bash install-macos.sh --install-dir "$fixture/bin" --no-profile
          test -x "$fixture/bin/mumax3"
          test "$("$fixture/bin/mumax3" -ultrafast-probe)" = \
            "mumax3-ultrafast desktop-api=1 backend=metal"

          printf '%s\n' '#!/bin/bash' \
            'echo "incompatible engine"' > "$fixture/release/mumax3"
          chmod +x "$fixture/release/mumax3"
          tar -C "$fixture/release" -czf "$fixture/release/mumax3-ultrafast-darwin-arm64.tar.gz" mumax3
          (
            cd "$fixture/release"
            shasum -a 256 mumax3-ultrafast-darwin-arm64.tar.gz \
              > mumax3-ultrafast-darwin-arm64.tar.gz.sha256
          )
          if HOME="$fixture/home" \
            MUMAX3_RELEASE_BASE_URL="file://$fixture/release" \
            bash install-macos.sh --install-dir "$fixture/bin" --no-profile; then
            echo "An incompatible engine unexpectedly installed" >&2
            exit 1
          fi
          test "$("$fixture/bin/mumax3" -ultrafast-probe)" = \
            "mumax3-ultrafast desktop-api=1 backend=metal"
          HOME="$fixture/home" bash install-macos.sh \
            --install-dir "$fixture/bin" --no-profile --uninstall
          test ! -e "$fixture/bin/mumax3"
          printf '%s\n' '#!/bin/bash' \
            'echo "unowned mumax3 command"' > "$fixture/bin/mumax3"
          chmod +x "$fixture/bin/mumax3"
          if HOME="$fixture/home" bash install-macos.sh \
            --install-dir "$fixture/bin" --no-profile --uninstall; then
            echo "The uninstaller unexpectedly removed an unowned mumax3 command" >&2
            exit 1
          fi
          test -e "$fixture/bin/mumax3"

      - name: Verify generated Metal sources
        run: |
          python3 cuda/metal/cmd/cuda2metal/generate.py --check
          python3 -m unittest discover -s cuda/metal/cmd/cuda2metal -p 'test_*.py'

      - name: Compile every Metal kernel
        run: |
          xcrun -f metal
          xcrun -f metallib
          make metal-shaders

      - name: Run platform-independent numerical tests
        run: CGO_ENABLED=0 go test ./cuda/metal/fft ./cuda/metal/rng

      - name: Compile and link Metal test binaries without a GPU
        run: go test -run '^$' ./cuda/metal/...

      - name: Compile all Go packages for Darwin arm64
        run: |
          test "$(go list -f '{{len .CXXFiles}}' ./cuda/metal)" -eq 1
          test "$(go list -f '{{len .CXXFiles}}' ./cuda/metal/fft)" -eq 1
          test "$(go list -f '{{len .CXXFiles}}' ./cuda/metal/rng)" -eq 1
          go build ./...

  desktop:
    name: Optional desktop app checks
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: pnpm install --frozen-lockfile

      - name: Check the frontend and Rust runtime
        working-directory: apps/desktop
        run: |
          pnpm build
          cargo fmt --manifest-path src-tauri/Cargo.toml --check
          cargo test --manifest-path src-tauri/Cargo.toml --locked
          cargo clippy --manifest-path src-tauri/Cargo.toml --locked --all-targets -- -D warnings

      - name: Build and inspect the unsigned app bundle
        working-directory: apps/desktop
        run: |
          pnpm tauri build --bundles app
          app_path='src-tauri/target/release/bundle/macos/mumax3 ultrafast.app'
          executable_name=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' \
            "$app_path/Contents/Info.plist")
          executable="$app_path/Contents/MacOS/$executable_name"
          test "$(/usr/libexec/PlistBuddy -c 'Print :LSMinimumSystemVersion' \
            "$app_path/Contents/Info.plist")" = "14.0"
          minos=$(otool -l "$executable" | awk \
            '/LC_BUILD_VERSION/ { section = 1 } section && $1 == "minos" { print $2; exit }')
          test "$minos" = "14.0"
          test -s "$app_path/Contents/Resources/mumax3 ultrafast.icns"
          test -s "$app_path/Contents/Resources/licenses/LICENSE"
          test -s "$app_path/Contents/Resources/licenses/NOTICE"
          test -s "$app_path/Contents/Resources/licenses/THIRD_PARTY_NOTICES.md"
          test -s "$app_path/Contents/Resources/licenses/DESKTOP_NOTICE"
          if strings "$executable" | grep -F "$GITHUB_WORKSPACE"; then
            echo "The desktop app embeds the CI checkout path" >&2
            exit 1
          fi

  gpu:
    name: GPU numerical regression and benchmarks
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' &&
      contains(github.event.head_commit.message, '[metal-gpu]'))
    runs-on: macos-15-xlarge
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false

      - name: Record Apple GPU
        run: |
          uname -a
          system_profiler SPDisplaysDataType

      - name: Verify and compile Metal sources
        run: |
          xcrun -f metal
          xcrun -f metallib
          make metal-shaders

      - name: Run Go and GPU numerical tests
        run: go test -vet=off -timeout 45m ./...

      - name: Build mumax3
        run: |
          go install ./cmd/mumax3
          "$(go env GOPATH)/bin/mumax3" -test

      - name: Run Metal benchmarks
        run: go test -run '^$' -bench . -benchmem ./cuda/metal/...

      - name: Run the mumax3 regression suite
        run: |
          mumax3_binary="$(go env GOPATH)/bin/mumax3"
          cd test
          ./run.bash "$mumax3_binary"
