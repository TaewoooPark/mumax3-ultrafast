<svg xmlns="http://www.w3.org/2000/svg" width="728" height="604" viewBox="0 0 728 604">
<defs><pattern id="hatch" width="5" height="5" patternTransform="rotate(45)" patternUnits="userSpaceOnUse"><line x1="0" y1="0" x2="0" y2="5" stroke="#ffffff" stroke-width="2.1"/></pattern></defs>
<rect width="728" height="604" fill="#ffffff"/>
<text x="78" y="30" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#202124">Smallest square mesh where extra Apple GPU width starts to pay</text>
<text x="78" y="48" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11" fill="#5f6368">Below its own bar a chip is limited by the 187 us per-evaluation overhead floor measured on the M4, not</text>
<text x="78" y="63" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11" fill="#5f6368">by bandwidth, so every chip here converges to the same ceiling and a wider GPU buys nothing. Above it the</text>
<text x="78" y="78" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11" fill="#5f6368">projected bandwidth-limited rate applies. Derived from each chip's projected 4.19M-cell rate and one</text>
<text x="78" y="93" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11" fill="#5f6368">measured floor, so only the M4 bar rests on a measurement of that chip; the floor itself is treated as</text>
<text x="78" y="108" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11" fill="#5f6368">chip-independent, which a faster CPU or cheaper dispatch would lower. Read it as an order of magnitude,</text>
<text x="78" y="123" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11" fill="#5f6368">not a threshold.</text>
