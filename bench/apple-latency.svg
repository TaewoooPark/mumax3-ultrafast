<svg xmlns="http://www.w3.org/2000/svg" width="552" height="802" viewBox="0 0 552 802">
<defs><pattern id="hatch" width="5" height="5" patternTransform="rotate(45)" patternUnits="userSpaceOnUse"><line x1="0" y1="0" x2="0" y2="5" stroke="#ffffff" stroke-width="2.1"/></pattern></defs>
<rect width="552" height="802" fill="#ffffff"/>
<text x="78" y="30" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#202124">Speedup on latency-bound MuMax3 workloads (Apple M4 10c)</text>
<text x="78" y="48" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11" fill="#5f6368">Same binary against commit a02cfd9b, medians of three interleaved runs in</text>
<text x="78" y="63" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11" fill="#5f6368">one session. These are the workloads whose step rate is set by host round</text>
<text x="78" y="78" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11" fill="#5f6368">trips rather than by arithmetic. The published 4.19M-cell point is</text>
<text x="78" y="93" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11" fill="#5f6368">bandwidth-bound and does not move: 1.0498e8 before against 1.0551e8 after,</text>
<text x="78" y="108" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11" fill="#5f6368">inside the 0.91% CV of the pooled anchor. The sweep bar compares -j 3</text>
<text x="78" y="123" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11" fill="#5f6368">against -j 1, so it is aggregate throughput, not single-run speed.</text>
