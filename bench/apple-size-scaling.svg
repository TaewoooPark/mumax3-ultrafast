<svg xmlns="http://www.w3.org/2000/svg" width="600" height="564" viewBox="0 0 600 564">
<defs><pattern id="hatch" width="5" height="5" patternTransform="rotate(45)" patternUnits="userSpaceOnUse"><line x1="0" y1="0" x2="0" y2="5" stroke="#ffffff" stroke-width="2.1"/></pattern></defs>
<rect width="600" height="564" fill="#ffffff"/>
<text x="78" y="30" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#202124">Measured MuMax3 throughput against problem size (Apple M4 10c)</text>
<text x="78" y="48" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11" fill="#5f6368">One machine, one binary, one size per fresh process, median of three, with the timed</text>
<text x="78" y="63" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11" fill="#5f6368">window sized per mesh so every point measures seconds of steady state. Three</text>
<text x="78" y="78" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11" fill="#5f6368">regimes, all three set by code paths rather than by the hardware: an overhead floor</text>
<text x="78" y="93" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11" fill="#5f6368">of 187 us per evaluation at and below 128^2, a peak at 256^2 where padded 512^2 is</text>
<text x="78" y="108" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11" fill="#5f6368">inside the default VkFFT gate, a dip at 512^2 where padded 1024^2 is not, the</text>
<text x="78" y="123" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11" fill="#5f6368">MPSGraph plateau that the published 4.19M-cell point sits on, and a decline past</text>
<text x="78" y="138" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11" fill="#5f6368">4096^2. The published point is not this machine's fastest: 256^2 is 1.39x better per</text>
<text x="78" y="153" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11" fill="#5f6368">cell.</text>
