<text x="78" y="30" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#202124">Energy for one identical simulation</text>
<text x="78" y="48" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11" fill="#5f6368">512² mesh, 2000 Heun steps = 1.049×10⁹ cell-evaluations in every arm, so the physics performed is</text>
<text x="78" y="63" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11" fill="#5f6368">the same and only the joules differ. GPU, CPU and combined rails sampled with powermetrics at 2 Hz</text>
<text x="78" y="78" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11" fill="#5f6368">while the workload ran; the machine's idle floor was 0.195 W combined. Higher is better.</text>
