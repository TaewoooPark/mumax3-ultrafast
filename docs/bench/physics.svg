<text x="78" y="30" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#202124">All four codes compute the same magnetization</text>
<text x="78" y="48" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11" fill="#5f6368">Relative deviation of the mean in-plane magnetization from mumax3-ultrafast after the same number</text>
<text x="78" y="63" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11" fill="#5f6368">of steps. Four independently written simulators, three languages, three backends — the worst</text>
<text x="78" y="78" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11" fill="#5f6368">disagreement anywhere in the sweep is 7.1×10⁻⁵. Points resting on the axis floor are exact</text>
<text x="78" y="93" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11" fill="#5f6368">agreement to every digit printed. Lower is better.</text>
