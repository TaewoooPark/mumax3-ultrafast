<svg xmlns="http://www.w3.org/2000/svg" width="860" height="470" viewBox="0 0 860 470">
<rect width="860" height="470" fill="#ffffff"/>
<text x="78" y="30" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#202124">Every micromagnetic simulator that runs on a Mac, on the same Mac</text>
<text x="78" y="48" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11" fill="#5f6368">Throughput on one M4 MacBook Air. Identical physics in every arm — demag + exchange, Heun</text>
<text x="78" y="63" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11" fill="#5f6368">integration at a fixed 1e-13 s step, the same number of steps per mesh — so each arm performs</text>
<text x="78" y="78" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11" fill="#5f6368">exactly two effective-field evaluations per step. Higher is better.</text>
